[project]
name = "nur"
description = "A script discovery and execution engine for your project's tasks."
license = "MIT"
readme = "README.md"
authors = [{ name = "Hasan Sezer Taşan", email = "hasansezertasan@gmail.com" }]
maintainers = [
  { name = "Hasan Sezer Taşan", email = "hasansezertasan@gmail.com" },
]
dynamic = ["version"]
keywords = [
  "cli",
  "tui",
  "developer-tools",
  "task-runner",
  "make",
  "npm",
  "just",
  "taskfile",
  "pdm",
  "poe",
  "mise",
  "cargo-make",
  "moon",
  "deno",
  "composer",
  "xc",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
  "Typing :: Typed",
]
requires-python = ">=3.14"
dependencies = ["textual>=3.0.0", "pyyaml>=6.0", "typer>=0.20.0"]

[project.optional-dependencies]
# Runnable-component and settings deps are core (see ``dependencies`` above), so
# no per-component extras remain. ``all`` is kept (empty) because the ``dev``
# dependency-group installs ``nur[all]``.
all = []


[project.urls]
changelog = "https://github.com/hasansezertasan/nur/blob/main/CHANGELOG.md"
documentation = "https://hasansezertasan.github.io/nur"
homepage = "https://github.com/hasansezertasan/nur"
issues = "https://github.com/hasansezertasan/nur/issues"
releasenotes = "https://github.com/hasansezertasan/nur/releases"
source = "https://github.com/hasansezertasan/nur.git"

[project.scripts]
nur = "nur.cli:main"


[dependency-groups]
dev = [
  "nur[all]",
  "tox==4.61.2",
  "tox-uv==1.36.0",
  "debugpy==1.8.21",
  { include-group = "style" },
  { include-group = "test" },
  { include-group = "docs" },
  { include-group = "tool" },
  { include-group = "prek" },
]
style = [
  "actionlint-py==1.7.12.24",
  "basedpyright==1.39.10",
  "editorconfig-checker==3.11.1",
  "import-linter==2.14",
  "mypy==2.3.1",
  "pylint==4.0.8",
  "pyrefly==1.2.0",
  "ruff==0.16.5",
  "slotscheck==0.20.1",
  "sphinx-lint==1.0.2",
  "taplo==0.9.3",
  "ty==0.0.75",
  "typos==1.49.1",
  "validate-pyproject[all]==0.26",
  "vulture==2.16",
  "zuban==0.9.3",
  "types-PyYAML>=6.0",             # yaml stubs for the Taskfile provider (mypy/type checkers)
  # "google-yamlfmt",
  # "shellcheck-makefile>=1.27.3",
  # "shellcheck-py>=0.10.0.1",
  # "types-setuptools",
  # "types-ujson",
  # "yamlfix>=1.18.0",
  # "yamlfmt>=1.1.1",
  # "yamllint>=1.37.1",
]
test = [
  "coverage-enable-subprocess==1.0",
  # Pinned to match main (Renovate-managed): coverage 7.13+ changed subprocess
  # signal patching, which hangs the SIGINT interrupt tests under subprocess
  # coverage on Linux/Windows. Let Renovate bump this separately.
  "coverage[toml]==7.11.0",
  "pytest-mock==3.15.1",
  "pytest-rerunfailures==16.6",
  "pytest-xdist[psutil]==3.8.0",
  "pytest==9.1.1",
  "pytest-sugar",
  "pytest-asyncio>=0.23.0",
  "dirty-equals",
  "inline-snapshot",
]
docs = [
  "sphinx==9.1.0",
  "shibuya==2026.7.12",
  "sphinx-autobuild==2025.8.25", # 2025.x drops Python 3.10 (requires-python >= 3.11)
  "sphinx-copybutton==0.5.2",
  "sphinx-design==0.7.0",        # 0.7.0 drops Python 3.10 (requires-python >= 3.11)
  "sphinx-togglebutton==0.4.5",
  "sphinx-paramlinks==0.6.0",
  "auto-pytabs[sphinx]==0.5.0",
  "myst-parser==5.1.0",
  "sphinx-click==6.2.0",
]
tool = [
  "commitizen==4.18.0",
  # "marimo==0.15.2",
  # "inflection==0.5.1",
  # "copier==9.11.0",
]
prek = ["prek==0.5.0"]


[build-system]

requires = ["hatchling", "hatch-vcs"]

build-backend = "hatchling.build"


[tool.uv]
add-bounds = "exact"
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } },
]
package = true
trusted-publishing = "always"


[tool.hatch.version]
source = "vcs"
# Last-resort sentinel: only used when a build sees neither a .git directory nor
# an expanded .git_archival.txt (e.g. an archive of a commit with no reachable
# tag). "0.0.0" reads clearly as "version could not be determined" rather than
# masquerading as a real early release. See .git_archival.txt + .gitattributes
# `export-subst` for the archive path that recovers the real tag-derived version.
fallback-version = "0.0.0"


[tool.hatch.build]
hooks.vcs.version-file = "src/nur/_version.py"


[tool.hatch.version.raw-options]
version_scheme = "only-version"
local_scheme = "no-local-version"

[tool.hatch.metadata]
allow-direct-references = true


[tool.hatch.build.targets.sdist]
# The package uses a src layout, so the source tree lives under /src (not
# /nur); including /src ships the actual modules -- and, for
# C-extension projects, the .pyx/.pxd sources needed to compile from the sdist.
include = ["/README.md", "LICENSE", "/src", "/tests"]


[tool.commitizen]
# Commit-authoring and message linting only. release-please owns version
# bumping, git tagging, and CHANGELOG.md (see .github/release-please-config.json),
# so the bump/tag/changelog settings are intentionally omitted here to avoid two
# tools competing over the same tags and changelog file.
name = "cz_conventional_commits"

[tool.pytest.ini_options]
# addopts = "-rXs --strict-config --strict-markers"
addopts = "-v --tb=short"
asyncio_mode = "auto"
filterwarnings = ["error"]
testpaths = ["tests"]
xfail_strict = true


[tool.coverage.run]
branch = true
# Match `_version.py` wherever it resolves: `src/...` in editable dev installs and
# `.../site-packages/...` when tox/CI installs the built wheel or sdist. A
# `src/**`-only pattern silently misses the installed copy and reports it at 0%.
omit = ["*/_version.py"]
parallel = true
source_pkgs = ["nur"]


[tool.coverage.paths]
# Unify coverage data across environments. tox installs the built wheel/sdist into
# each env's site-packages, so the same source file is measured under a different
# `.tox/<env>/.../site-packages/nur` path per interpreter. Without
# remapping those back to the canonical `src/` tree, `coverage combine` keeps a
# separate copy per env and a version-gated line covered in one interpreter but not
# another is wrongly counted as missed — silently failing the `fail_under` gate.
# `tests` needs no remapping: it is never installed, so every environment measures
# it at the same repo-local path.
nur = ["src/nur", "*/site-packages/nur"]


[tool.coverage.report]
# Untestable code is excluded per site with `# pragma: no cover`, not with blanket
# patterns here: a regex matching a `def` line excludes the *whole function body*,
# so a pattern like `def main\(` would silently un-measure any future `main()`
# with real logic (and did mask the tested GUI/TUI entrypoints). Pragmas carry the
# exclusion decision next to the code it affects. See ADR-008.
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  # Protocol/abstract method stubs have no executable body.
  "\\.\\.\\.",
]
fail_under = 99
# Patterns match both the `src/` (editable) and installed (`site-packages`)
# layouts (see [tool.coverage.run] omit).
omit = ["*/_version.py"]
show_missing = true
skip_covered = true


[tool.vulture]
# Framework-invoked handlers: Typer commands, FastAPI routes, FastStream
# lifecycle hooks, and the MCP tool dispatcher.
ignore_decorators = [
  "@app.command",
  "@app.get",
  "@app.after_startup",
  "@app.after_shutdown",
  "@server.call_tool",
]
# Public API surfaces vulture cannot see being used: ``main`` entry points are
# referenced only via pyproject scripts, ``model_config`` is consumed by
# pydantic-settings, ``logger`` is imported only by optional components, the MCP
# ``arguments`` parameter is mandated by the call_tool signature, the Textual
# names (CSS/compose/on_mount/title/BINDINGS) are invoked by the TUI framework,
# and ``pytestmark`` is consumed by pytest at collection time.
ignore_names = [
  "CONFIG_FILE_PATH",
  "logger",
  "main",
  "model_config",
  "CSS",
  "CSS_PATH",
  "compose",
  "on_mount",
  "on_*",
  "action_*",
  "title",
  "BINDINGS",
  "nur_task",
  "pytestmark",
  "return_value",
  "side_effect",
]
# 70 avoids the 60%-confidence false positives on Textual-managed attributes
# (``_detail_text``/``_status_text`` are assigned in one handler, read in another).
min_confidence = 70
# Scan the package only: test fixtures/monkeypatch lambdas have throwaway args
# (``*a, **k``) that vulture would flag as unused.
paths = ["src"]


[tool.slotscheck]
strict-imports = false
# Textual widgets don't declare __slots__; excluding the TUI keeps slotscheck
# focused on the plain-class core without false positives.
exclude-modules = "nur.tui"


[tool.typos.default.extend-words]
# Intentional misspelling used to exercise the close-match suggestion path
# (tests/unit/test_registry.py resolves "biuld").
biuld = "biuld"
# Intentional misspelling used to exercise the "did you mean build?" suggestion
# (tests/integration/test_cli.py).
buld = "buld"


[tool.importlinter]
root_package = "nur"


[[tool.importlinter.contracts]]
name = "Layered architecture with independent components"
type = "layers"
# Layers are listed high -> low: a layer may import lower layers but never a
# higher one. Modules joined by ` | ` on one line are independent SIBLINGS that
# may not import each other. `cli` is the orchestrator layer — it drives
# discovery/execution and launches the `tui` via a lazy import — so it sits ABOVE
# the `tui`, which sits above `discovery`. `discovery` composes the independent
# `providers | execution | registry` group, which all sit above the leaf
# `models` data types. `__init__`, `__main__`, and `_version` are left outside
# the contract as unconstrained foundations.
layers = [
  "nur.cli",
  "nur.tui",
  "nur.core.discovery",
  "nur.core.providers | nur.core.execution | nur.core.registry",
  "nur.core.models",
]


[tool.ruff]
# docs/superpowers/ holds frozen internal design/planning docs (already walled
# off from Sphinx via conf.py exclude_patterns and from markdownlint). In preview
# mode `ruff format` reformats Python code fences inside their Markdown, so
# exclude the tree here too — those illustrative snippets are not project source.
extend-exclude = ["docs/superpowers"]
fix = true
output-format = "full"
preview = true
show-fixes = true
src = ["src", "tests"]
target-version = "py314"
unsafe-fixes = true


[tool.ruff.analyze]
detect-string-imports = true
preview = true


[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
preview = true
skip-magic-trailing-comma = true


[tool.ruff.lint]
fixable = ["ALL"]
ignore = [
  "missing-trailing-comma",
  "CPY",
  "FIX",
  "TD",
  # Two opinionated ruff 0.16 preview rules are disabled: RUF105 would rewrite the
  # portable `# noqa` comments into ruff's own `# ruff: ignore` syntax (its docs note
  # `# noqa` is needed for cross-tool compatibility), and RUF201 would rewrite every
  # rule *code* in this config's selectors into long rule *names*. Both are stylistic.
  "RUF105",
  "RUF201",
  # Docstrings on every public symbol are not enforced yet; the ported source
  # was written to a lighter standard. Tracked as a follow-up, not a day-one gate.
  "undocumented-public-module",
  "undocumented-public-class",
  "undocumented-public-method",
  "undocumented-public-function",
  "undocumented-public-package",
  "undocumented-public-init",
  "docstring-missing-returns",
  "docstring-missing-exception",
]
logger-objects = ["logging_setup.logger"]
preview = true
select = ["ALL"]

[tool.ruff.lint.isort]
combine-as-imports = true
# skip-magic-trailing-comma = true
split-on-trailing-comma = false

[tool.ruff.lint.flake8-copyright]
author = "Hasan Sezer Taşan <hasansezertasan@gmail.com>"


[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"


[tool.ruff.lint.mccabe]
# nur's parsers and the CLI dispatch are legitimately branchy (each source
# format and each task-resolution outcome is a distinct path); 10 keeps a
# guard-rail without forcing artificial helper splits.
max-complexity = 10


[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true


[tool.ruff.lint.pydocstyle]
convention = "pep257"


[tool.ruff.lint.per-file-ignores]
# Recursive glob so nested test packages (tests/cli, tests/gui, ...) are covered.
# Tests legitimately use asserts/magic values, reach into package internals, and
# don't need return-value documentation on their fixtures and helpers.
"tests/**/*.py" = [
  "ANN",                       # tests don't need type annotations on fixtures/helpers
  "D",                         # tests don't need docstrings
  "assert",                    # asserts are the point of a test
  "private-member-access",     # white-box tests reach into package internals
  "ARG",                       # pytest fixtures/monkeypatch lambdas take unused args
  "magic-value-comparison",    # magic values are fine in assertions
  "no-self-use",               # test methods needn't use self
  "import-outside-top-level",  # local imports keep test isolation
  "compare-to-empty-string",   # explicit empty-string compares read clearer in tests
  "import-private-name",       # importing private members for testing
  "docstring-missing-returns", # helper return values needn't be documented
]
# The __main__ smoke test runs `python -m nur` in a real subprocess (the only
# faithful check that the module entry point is wired up); the subprocess
# import/call are the point of the test, not a risk.
"tests/smoke/test_main_module.py" = [
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
]
# The Sphinx config is a standalone module, not part of an importable package.
"docs/conf.py" = ["implicit-namespace-package"]
# Typer's declarative API puts function calls (Argument/Option) in argument
# defaults by design, so B008 is expected here.
# Typer's declarative API puts function calls (Argument/Option) in argument
# defaults, and a boolean --version option is idiomatic, by design.
"src/nur/cli.py" = [
  "function-call-in-default-argument",
  "boolean-type-hint-positional-argument",
]
# Discovery must not crash on one malformed source file: catching broadly and
# skipping is deliberate robustness.
"src/nur/core/discovery.py" = ["blind-except"]
# nur is a task runner: executing discovered project commands via subprocess is
# the whole point, so the shell/subprocess-audit rules are intended here. The
# assert narrows an Optional Popen handle for the type checkers. T201: it prints
# a user-facing "runner not installed" error to stderr by design (do NOT let
# ruff's preview/unsafe autofix delete the print).
"src/nur/core/execution.py" = [
  "assert",
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
  "print",
]
# The providers package intentionally builds the PROVIDERS registry in __init__.
"src/nur/core/providers/__init__.py" = ["non-empty-init-module"]
# Providers implement a shared Protocol (so detect()/_source_file() must stay
# instance methods -> PLR6301), shell out to their runner by name (S404/S603/
# S607), and parse tokens that trip the hardcoded-password heuristic (S105).
"src/nur/core/providers/*.py" = [
  "no-self-use",
  "suspicious-subprocess-import",
  "subprocess-without-shell-equals-true",
  "start-process-with-partial-path",
  "hardcoded-password-string",
]
# Textual invokes compose() as an instance method and stores BINDINGS as a
# class-level list, both mandated by the framework. The assert in _matches()
# narrows the post-scan Optional Registry for the type checker; _rebuild()
# guarantees it's non-None before _matches() is ever called.
"src/nur/tui/app.py" = ["no-self-use", "mutable-class-default", "assert"]


[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true


[tool.ruff.lint.ruff]
parenthesize-tuple-in-subscript = true


[tool.mypy]
files = ["src"]
pretty = true
python_version = "3.14"
strict = true


[tool.basedpyright]
exclude = [".venv"]
include = ["src/nur"]
pythonVersion = "3.14"
venv = ".venv"
# Silence basedpyright's strict-mode *warnings* that fight this project's
# deliberate patterns; error-level type checking stays on (0 errors), and dead
# code is still caught by ruff + vulture:
#   - reportAny / reportExplicitAny: providers parse untyped JSON/TOML/YAML.
#   - reportUnannotatedClassAttribute: Textual widgets and provider classes use
#     bare class attributes (``prefix = "npm"``, ``BINDINGS = [...]``).
#   - reportCallInDefaultInitializer / reportUnusedParameter: Typer's declarative
#     API (Argument/Option in defaults; the eager --version callback param).
#   - reportUnusedFunction: the ``@app.command()`` handler is used by Typer.
#   - reportUnusedCallResult: Textual mount/query calls return discarded widgets.
#   - reportImplicitStringConcatenation: wrapped f-string error messages.
reportAny = false
reportExplicitAny = false
reportUnannotatedClassAttribute = false
reportCallInDefaultInitializer = false
reportUnusedParameter = false
reportUnusedFunction = false
reportUnusedCallResult = false
reportImplicitStringConcatenation = false
# venvPath is the directory *containing* the venv, not the venv itself; ".venv"
# here would make basedpyright look for ".venv/.venv". Use "." so both the venv
# and basedpyright's strict ruleset resolve the project's installed deps.
venvPath = "."

# Textual's App/Worker/query APIs are generically typed as Unknown under strict
# checking; the TUI glue code can't satisfy it without noise. Relax only the
# Unknown-* reports for this module (real type errors still surface).
[[tool.basedpyright.executionEnvironments]]
root = "src/nur/tui"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
# Textual's mount/query calls return widgets that are idiomatically discarded,
# and action_* handlers override App methods without an explicit decorator.
reportUnusedCallResult = false
reportImplicitOverride = false

# Providers parse untyped external data (json.loads / tomllib.loads / yaml → Any),
# so strict basedpyright reports every derived value as Unknown. Relax only the
# Unknown-* reports here; mypy/ty/pyrefly still fully type-check these modules.
[[tool.basedpyright.executionEnvironments]]
root = "src/nur/core/providers"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false


[tool.ty.src]
# Type-check the package. Tests are excluded here: the pinned ty (0.0.53)
# misreads pytest's skip()/fail() reason argument as "too many positional
# arguments"; mypy already covers the package's public surface.
include = ["src"]
respect-ignore-files = false


[tool.ty.environment]
python-version = "3.14"


[tool.ty.terminal]
error-on-warning = true


[tool.pyrefly]
python-version = "3.14"
# Pin the type-checking platform so results are deterministic across CI runners.
# Unlike mypy/basedpyright/ty, pyrefly does not narrow `sys.platform` to the
# host OS, so on the Windows runner it would otherwise flag POSIX-only
# os.killpg/os.getpgid in the platform-guarded interrupt path. The Windows
# branches remain type-checked by the other three checkers on that runner.
python-platform = "linux"
project-includes = ["src"]

[tool.pylint.main]
# pylint runs as an always-on gate that deliberately overlaps ruff's PL* rules.
# Its canonical invocation is `pylint src`, so it never descends into tests; this
# ignore-paths is a defensive scope guard for broader invocations (`pylint .`,
# filename-passing hooks). Tests are linted by ruff, not pylint.
ignore-paths = ["^tests/.*$"]
# `.pyi` stubs (the c-extension type stub) are signature-only: their bodies are
# `...` and every parameter is unused by construction, so pylint's unused-argument
# check is a guaranteed false positive there. Stubs are type-checked by the
# type-checker gate, not pylint.
ignore-patterns = ['.*\.pyi$']

[tool.pylint."messages control"]
# Only formatter-owned checks, the docstring family, and too-few-public-methods
# are disabled so pylint is usable out of the box; everything else stays on.
disable = [
  "line-too-long",              # C0301 — ruff-format owns line length
  "missing-module-docstring",   # C0114
  "missing-class-docstring",    # C0115
  "missing-function-docstring", # C0116
  "too-few-public-methods",     # R0903 — trips dataclasses / config / Protocol classes
  "import-outside-toplevel",    # C0415 — components (cli->tui/gui/web, and each
  # component's own optional-dependency probe) are
  # deliberately lazy-imported so import-linter's
  # layering contract holds and optional extras
  # aren't required at import time.
  "try-except-raise", # W0706 — the generated TUI entry point
  # explicitly re-raises KeyboardInterrupt/SystemExit
  # ahead of a broad `except Exception` to make the
  # "let these propagate" intent obvious to readers,
  # even though BaseException subclasses wouldn't be
  # caught by the Exception clause anyway.
  "duplicate-code", # R0801 — the component skeletons (gui/tui/mcp/
  # worker) are deliberately parallel: each fetches
  # package metadata and formats the same info block
  # the same way. That structural symmetry is a
  # feature of the scaffold, not copy-paste debt, and
  # R0801 cannot be suppressed inline at the call site.
]

[tool.pylint.design]
max-args = 10
max-positional-arguments = 10
max-branches = 20
# The Textual TUI App legitimately holds many widget/state attributes, and the
# text-parsing providers (e.g. xc) accumulate more than the default 15 locals —
# the same "parsers and UI are legitimately complex" rationale as max-branches.
max-attributes = 12
max-locals = 20

[tool.tox]
# The ``worker`` env is intentionally omitted: it starts a broker-bound process
# and would hang/fail under ``tox run`` in CI (where no broker is available).
# The worker is covered by its pytest TestBroker suite; run it on demand with
# ``tox -e worker`` when a broker is up (e.g. inside the devcontainer).
env_list = ["style", "cli", "3.14"]
requires = ["tox>=4"]


[tool.tox.env_run_base]
commands = [
  [
    "coverage",
    "run",
    "--module",
    "pytest",
    "-v",
    "--tb=short",
    "--basetemp={env_tmp_dir}",
    { replace = "posargs", default = [
    ], extend = true },
  ],
]
constrain_package_deps = true
dependency_groups = ["test"]
description = "Run the tests under {base_python}"
env_tmp_dir = "{toxworkdir}/tmp/{envname}"
# Arms coverage-enable-subprocess so xdist/subprocess workers are measured too;
# `coverage run` plus `parallel = true` writes per-env data files that the CI
# `coverage combine` step merges.
set_env = { COVERAGE_PROCESS_START = "{tox_root}/pyproject.toml" }
extras = ["all"]

package = "wheel"

runner = "uv-venv-runner"
use_frozen_constraints = true
wheel_build_env = ".pkg"


[tool.tox.env.style]
base_python = ["3.14"]
commands = [
  ["ruff", "check", "--no-fix"],
  ["ruff", "format", "--check", "--diff"],
  ["mypy", "--python-version", "3.14"],
  ["basedpyright"],
  ["ty", "check"],
  ["pyrefly", "check"],
  ["zuban", "check", "src"],
  ["pylint", "src"],
  ["vulture"],
  ["python", "-m", "slotscheck", "src"],
  ["lint-imports"],
  ["taplo", "lint", "*.toml"],
  # NOTE: kept in fix mode (not `--check`) because the rendered TOML is not yet
  # guaranteed taplo-formatted across every component combination. The `*.toml`
  # glob is non-recursive, so it scopes taplo to this project's own root TOML
  # (pyproject/prek/mise) without walking vendored `.tox`/`.venv`/site-packages
  # trees — no `.taplo.toml` exclude config needed. Making this a strict
  # `--check` gate is a follow-up that first requires the generated
  # pyproject/prek to be clean.
  ["taplo", "format", "*.toml"],
  ["validate-pyproject", "pyproject.toml"],
  ["typos", "--diff"],
  ["actionlint"],
  ["ec"],
  ["sphinx-lint", "docs"],
  # ["yamlfmt", "."],
]
# `test` is included so the type checkers that scope tests (e.g. ty) can
# resolve pytest and other test-only imports.
dependency_groups = ["style", "test"]
description = "Run Checkers, Linters and Formatters"
# Optional components (web/gui/tui/mcp/worker) are only importable when their
# extra is installed; without this, pylint/mypy/etc. see import-error for any
# optional component present in this render.
extras = ["all"]
runner = "uv-venv-runner"


[tool.tox.env.prek]
commands = [["prek", "run", "--all-files"]]
dependency_groups = ["prek"]
description = "Run prek hooks"
runner = "uv-venv-runner"


[tool.tox.env.docs-build]
commands = [["sphinx-build", "-b", "html", "docs", "docs/_build/html"]]
extras = ["all"]
dependency_groups = ["docs"]
description = "Build Docs"
runner = "uv-venv-runner"


[tool.tox.env.docs-server]
commands = [["sphinx-autobuild", "docs", "docs/_build/html"]]
extras = ["all"]
dependency_groups = ["docs"]
description = "Start the live-reloading docs server"
runner = "uv-venv-runner"


[tool.tox.env.docs-linkcheck]
# On-demand link checker. Also run weekly (non-blocking) by docs-linkcheck.yml.
# Hits the network, so it is deliberately not part of the `style` env or PR CI.
commands = [
  [
    "sphinx-build",
    "-b",
    "linkcheck",
    "docs",
    "docs/_build/linkcheck",
  ],
]
extras = ["all"]
dependency_groups = ["docs"]
description = "Check documentation for broken links"
runner = "uv-venv-runner"

[tool.tox.env.cli]
commands = [
  [
    "nur",
    { replace = "posargs", default = [
      "--version",
    ], extend = true },
  ],
]
description = "Run the CLI application."
runner = "uv-venv-runner"
